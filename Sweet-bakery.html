<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашняя выпечка на заказ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #fdfbf7; color: #4a3e3d; line-height: 1.6; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #8b5a2b; margin-bottom: 10px; }
        p.subtitle { text-align: center; color: #7a6a68; margin-bottom: 30px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { border: 1px solid #f0e6df; border-radius: 10px; padding: 15px; background: #fffaf7; text-align: center; }
        .card h3 { color: #5c3a21; margin-bottom: 5px; }
        .price { font-weight: bold; color: #d97736; margin-bottom: 10px; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 10px; }
        .controls button { background: #8b5a2b; color: white; border: none; width: 30px; height: 30px; border-radius: 5px; font-size: 18px; cursor: pointer; }
        .controls button:hover { background: #6f4722; }
        .order-section { border-top: 2px dashed #f0e6df; padding-top: 20px; margin-top: 20px; }
        .total { font-size: 20px; font-weight: bold; text-align: right; margin-bottom: 20px; color: #8b5a2b; }
        form { display: flex; flex-direction: column; gap: 15px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #dcd0c7; border-radius: 8px; font-size: 16px; }
        input:focus, textarea:focus { outline: none; border-color: #8b5a2b; }
        .submit-btn { background: #d97736; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .submit-btn:hover { background: #bf6327; }
    </style>
</head>
<body>

<div class="container">
    <h1>🥐 Домашняя Выпечка & Торты</h1>
    <p class="subtitle">Свежее, вкусное, приготовленное с любовью!</p>

    <h2>Наше меню</h2>
    <div class="menu-grid">
        <div class="card">
            <h3>Торт "Наполеон"</h3>
            <p class="price">1200 ₽ / кг</p>
            <div class="controls">
                <button onclick="changeQty('napoleon', -1, 1200)">-</button>
                <span id="qty-napoleon">0</span>
                <button onclick="changeQty('napoleon', 1, 1200)">+</button>
            </div>
        </div>
        <div class="card">
            <h3>Капкейки (6 шт)</h3>
            <p class="price">900 ₽</p>
            <div class="controls">
                <button onclick="changeQty('cupcakes', -1, 900)">-</button>
                <span id="qty-cupcakes">0</span>
                <button onclick="changeQty('cupcakes', 1, 900)">+</button>
            </div>
        </div>
        <div class="card">
            <h3>Булочки с корицей</h3>
            <p class="price">150 ₽ / шт</p>
            <div class="controls">
                <button onclick="changeQty('cinnabon', -1, 150)">-</button>
                <span id="qty-cinnabon">0</span>
                <button onclick="changeQty('cinnabon', 1, 150)">+</button>
            </div>
        </div>
    </div>

    <div class="order-section">
        <div class="total">Итого: <span id="total-price">0</span> ₽</div>

        <form id="orderForm" onsubmit="sendOrder(event)">
            <h3>Оформление заказа</h3>
            <input type="text" id="name" placeholder="Ваше имя" required>
            <input type="tel" id="phone" placeholder="Ваш номер телефона" required>
            <textarea id="comment" rows="3" placeholder="Адрес доставки или комментарий к заказу (например, желаемая дата)"></textarea>
            <button type="submit" class="submit-btn">Отправить заказ</button>
        </form>
    </div>
</div>

<script>
    const items = {
        napoleon: { name: 'Торт "Наполеон"', qty: 0, price: 1200 },
        cupcakes: { name: 'Капкейки (6 шт)', qty: 0, price: 900 },
        cinnabon: { name: 'Булочки с корицей', qty: 0, price: 150 }
    };

    function changeQty(itemId, delta, price) {
        if (items[itemId].qty + delta >= 0) {
            items[itemId].qty += delta;
            document.getElementById(`qty-${itemId}`).innerText = items[itemId].qty;
            calculateTotal();
        }
    }

    function calculateTotal() {
        let total = 0;
        for (let key in items) {
            total += items[key].qty * items[key].price;
        }
        document.getElementById('total-price').innerText = total;
    }

    function sendOrder(event) {
        event.preventDefault();
        
        let total = document.getElementById('total-price').innerText;
        if (total == 0) {
            alert('Пожалуйста, выберите хотя бы один товар!');
            return;
        }

        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const comment = document.getElementById('comment').value;

        // Формируем текст заказа
        let orderText = `Заказ от ${name} (${phone}):\n`;
        for (let key in items) {
            if (items[key].qty > 0) {
                orderText += `- ${items[key].name}: ${items[key].qty} шт.\n`;
            }
        }
        orderText += `Сумма: ${total} ₽\nКомментарий: ${comment}`;

        alert('Спасибо за заказ! Мы свяжемся с вами в ближайшее время.\n\nДетали заказа:\n' + orderText);
        // Здесь можно подключить отправку в Telegram-бот или на Email
    }
</script>

</body>
</html>
